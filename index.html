<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이든의 퍼즐</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="이든의 퍼즐">
<meta name="theme-color" content="#FEFCF5">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
[hidden]{display:none!important}
.packhead{grid-column:1/-1;font-weight:800;font-size:15px;color:#8A8672;margin:8px 2px -6px}
:root{
  --bg:#FEFCF5; --panel:#FFFFFF; --ink:#3A4258; --sub:#8A8672;
  --accent:#FF8A3D; --accent-deep:#E86F1E; --mint:#3FBF8F; --gold:#F2B01E; --line:#DED6C2;
  --shadow:3px 4px 0 rgba(58,66,88,.10);
  --wob:18px 22px 16px 24px / 22px 16px 24px 18px;
  --wob-big:26px 30px 24px 32px / 30px 24px 32px 26px;
  --disp:'Jua','Apple SD Gothic Neo',sans-serif;
  --body:'Gowun Dodum','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
body{background:var(--bg); color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.5;
  background-image:radial-gradient(rgba(58,66,88,.05) 1.2px, transparent 1.3px); background-size:24px 24px}
button{font-family:var(--disp); border:0; cursor:pointer; color:var(--ink); background:none}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:12px}
h1,h2,h3{font-family:var(--disp); font-weight:400; margin:0; text-wrap:balance}
.squig{display:inline-block; height:8px; width:110px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='8' viewBox='0 0 120 8'><path d='M2 5 Q 12 1 22 5 T 42 5 T 62 5 T 82 5 T 102 5 T 118 5' fill='none' stroke='%23FF8A3D' stroke-width='3' stroke-linecap='round'/></svg>") repeat-x}

#panicHome{position:fixed; top:10px; right:10px; z-index:5000; background:var(--panel);
  border:3px solid var(--ink); border-radius:999px; padding:8px 16px; font-family:var(--disp);
  font-size:16px; box-shadow:var(--shadow)}

/* ── 타이틀 화면 (시작 버튼 탭으로 진입, 세션당 1회) ── */
#splash{position:fixed; inset:0; z-index:100; background:var(--bg);
  background-image:radial-gradient(rgba(58,66,88,.05) 1.2px, transparent 1.3px); background-size:24px 24px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:18px;
  overflow:hidden; transition:opacity .4s}
#splash.bye{opacity:0; pointer-events:none}
#splash .tlogo{width:120px; height:120px; transform:rotate(-6deg); animation:swing 1.2s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(6deg) scale(1.05)}}
#splash .sname{font-family:var(--disp); font-size:40px; color:var(--ink)}
#splash .tstart{font-family:var(--disp); font-size:26px; color:#fff; background:var(--accent);
  border:3px solid var(--ink); border-radius:999px; padding:14px 48px; margin-top:8px;
  box-shadow:var(--shadow); animation:pulse 1.6s ease-in-out infinite alternate}
#splash .tstart:active{transform:scale(.94)}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.07)}}
#splash .tp{position:absolute; animation:tfloat ease-in-out infinite alternate; opacity:.9}
@keyframes tfloat{from{transform:translateY(-9px) rotate(var(--r,0deg))}to{transform:translateY(10px) rotate(calc(var(--r,0deg) + 8deg))}}
@media (prefers-reduced-motion:reduce){#splash .tlogo,#splash .tstart,#splash .tp{animation:none}}

/* ── 홈 ── */
#home{max-width:900px; margin:0 auto; padding:20px 16px 40px; display:flex; flex-direction:column; gap:20px}
.topline{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.logo{display:flex; align-items:center; gap:10px; font-family:var(--disp); font-size:28px}
.logo svg{width:34px; height:34px; transform:rotate(-6deg)}
.topline .spacer{flex:1}
.stat{display:flex; align-items:center; gap:5px; background:var(--panel); border:3px solid var(--ink);
  border-radius:var(--wob); padding:4px 13px; font-family:var(--disp); font-size:16px; box-shadow:var(--shadow)}
.stat b{font-variant-numeric:tabular-nums}
/* 관련 스탯끼리 한 알약으로 묶기: [기록 🏆🔥] [코인 ⭐🌈] */
.statgrp{display:flex; align-items:stretch; background:var(--panel); border:3px solid var(--ink);
  border-radius:999px; box-shadow:var(--shadow); overflow:hidden}
.statgrp .seg{display:flex; align-items:center; gap:5px; padding:4px 12px; font-family:var(--disp); font-size:16px}
.statgrp .seg+.seg{border-left:2px dashed var(--line)}
.statgrp .seg b{font-variant-numeric:tabular-nums}
/* 게스트: 아직 로그인 전 임시 상태 — 점선·뮤트로 다르게 */
.stat.guest{border-style:dashed; border-color:var(--sub); color:var(--sub); background:transparent; box-shadow:none; font-size:15px}

.daily{background:var(--panel); border-radius:var(--wob-big); box-shadow:var(--shadow); padding:18px;
  display:flex; gap:18px; align-items:center; border:4px solid var(--accent); transform:rotate(-.4deg)}
.daily canvas{width:200px; height:150px; border-radius:14px 18px 14px 20px/18px 14px 20px 14px;
  flex:none; background:#eee; border:3px solid var(--ink)}
.daily .info{display:flex; flex-direction:column; gap:8px; min-width:0}
.eyebrow{font-family:var(--disp); font-size:14px; color:var(--accent-deep); letter-spacing:.08em}
.daily h2{font-size:26px}
.daily .date{color:var(--sub); font-size:14px}
.playbtn{background:var(--accent); color:#fff; font-size:20px; padding:12px 26px;
  border-radius:var(--wob); border:3px solid var(--ink);
  box-shadow:3px 4px 0 rgba(58,66,88,.25); align-self:flex-start; transition:transform .1s}
.playbtn:active{transform:translateY(3px); box-shadow:1px 1px 0 rgba(58,66,88,.25)}

.sect{display:flex; flex-direction:column; gap:2px}
.sect .row{display:flex; align-items:baseline; gap:10px}
.sect h2{font-size:20px}
.sect small{color:var(--sub)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:16px}
.card{background:var(--panel); border-radius:var(--wob); border:3px solid var(--ink);
  box-shadow:var(--shadow); padding:9px; display:flex; flex-direction:column; gap:8px;
  text-align:left; transition:transform .12s}
.grid .card:nth-child(odd){transform:rotate(-.7deg)}
.grid .card:nth-child(even){transform:rotate(.6deg)}
.grid .card:hover{transform:translateY(-3px) rotate(0deg)}
.card canvas,.card .ph{width:100%; aspect-ratio:4/3; border-radius:10px 14px 10px 14px/14px 10px 14px 10px;
  background:#eee; border:2px solid var(--line)}
.card .row{display:flex; align-items:center; gap:6px; padding:0 4px 4px}
.card .name{font-family:var(--disp); font-size:17px; flex:1}
.chip{font-family:var(--disp); font-size:12px; border-radius:999px; padding:2px 9px; border:2px solid transparent}
.chip.free{background:#E4F5EA; color:#1E7A54; border-color:#B9E2C8}
.chip.prem{background:#FCF0CE; color:#8F6A00; border-color:#EDD98F}
.chip.star{background:none; padding:0; font-size:15px; border:0}
.photo-card .ph{display:flex; align-items:center; justify-content:center; font-size:44px;
  background:repeating-linear-gradient(45deg,#FFF8E8 0 12px,#FCF0CE 12px 24px); color:var(--gold)}
.note{color:var(--sub); font-size:13px; text-align:center; margin-top:8px}

/* ── 조각 수 선택 시트 ── */
#sheet{position:fixed; inset:0; background:rgba(58,66,88,.45); display:flex; align-items:flex-end;
  justify-content:center; z-index:50}
#sheet .box{background:var(--panel); border-radius:26px 30px 0 0/30px 26px 0 0; border:3px solid var(--ink);
  border-bottom:0; padding:22px 18px 30px; width:min(560px,100%); display:flex; flex-direction:column; gap:14px}
#sheet h3{font-size:22px; text-align:center}
.stylerow{display:flex; gap:8px; justify-content:center}
.stylechip{border:3px solid var(--line); border-radius:999px; padding:8px 18px; font-size:16px; background:var(--panel)}
.stylechip.on{border-color:var(--accent); background:#FFF3E6; color:var(--accent-deep)}
#sheet .opts{display:grid; grid-template-columns:1fr 1fr; gap:10px}
#sheet .opt{border:3px solid var(--line); border-radius:var(--wob); padding:14px 8px; font-size:19px;
  display:flex; flex-direction:column; gap:2px; background:var(--panel)}
#sheet .opt small{font-family:var(--body); color:var(--sub); font-size:13px}
#sheet .opt .resume{color:var(--accent-deep); font-family:var(--disp); font-size:13px}
#sheet .opt:hover{border-color:var(--accent)}
#sheet .cancel{color:var(--sub); font-size:16px; padding:8px}

/* ── 게임 ── */
#game{position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; z-index:20;
  background-image:radial-gradient(rgba(58,66,88,.05) 1.2px, transparent 1.3px); background-size:24px 24px}
#gtop{display:flex; align-items:center; gap:10px; padding:10px 14px}
#gtop .gbtn{background:var(--panel); border:3px solid var(--ink); border-radius:var(--wob);
  padding:6px 15px; font-size:16px; box-shadow:var(--shadow)}
#gtitle{font-family:var(--disp); font-size:18px; flex:1; text-align:center; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
#gcount{font-family:var(--disp); background:var(--panel); border:3px solid var(--ink);
  border-radius:var(--wob); padding:6px 13px; font-size:15px; font-variant-numeric:tabular-nums; box-shadow:var(--shadow)}
#arena{position:relative; flex:1; overflow:hidden; touch-action:none}
#board{position:absolute; border-radius:12px; background:var(--panel);
  box-shadow:inset 0 0 0 3px var(--line), var(--shadow)}
#ghost{position:absolute; inset:0; width:100%; height:100%; border-radius:12px}
.piece{position:absolute; touch-action:none; will-change:transform; cursor:grab;
  filter:drop-shadow(0 3px 4px rgba(58,66,88,.25))}
.piece.drag{filter:drop-shadow(0 10px 14px rgba(58,66,88,.35)); cursor:grabbing; z-index:999!important}
.piece.placed{filter:none; pointer-events:none; z-index:1!important}
@keyframes snapPop{0%{transform:scale(1)}45%{transform:scale(1.14)}100%{transform:scale(1)}}
.piece.pop{animation:snapPop .16s ease-out}
#peek{position:absolute; inset:0; width:100%; height:100%; border-radius:12px; z-index:1000; pointer-events:none}
#gprog{height:10px; margin:0 14px 8px; border:2px solid var(--ink); border-radius:999px;
  background:var(--panel); overflow:hidden; flex:none}
#gprogFill{display:block; height:100%; width:0; background:var(--mint); border-radius:999px; transition:width .25s}
#winwrap{position:fixed; inset:0; z-index:60; display:flex; align-items:center; justify-content:center;
  background:rgba(58,66,88,.35)}
#winwrap .win{background:var(--panel); border-radius:var(--wob-big); padding:34px 40px; text-align:center;
  display:flex; flex-direction:column; gap:14px; box-shadow:var(--shadow); border:4px solid var(--mint);
  transform:rotate(-.5deg)}
#winwrap h2{font-size:34px; color:#1E7A54}
#winwrap .stars{font-size:34px; letter-spacing:.1em}
#winwrap .wbtns{display:flex; gap:10px; justify-content:center}
.wcoin{font-family:var(--disp); font-size:22px; color:var(--ink)}
.wcoin:empty{display:none}
#sheetCoin{margin:0; font-size:15px; color:var(--sub); text-align:center}
#sheetCoin.deny{color:var(--accent-deep); font-weight:700}
#sheetCoin.shake{animation:coinshake .4s}
@keyframes coinshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
#winwrap .wbtns .playbtn{align-self:auto}
#winwrap .again{background:var(--panel); border:3px solid var(--ink); border-radius:var(--wob);
  padding:12px 22px; font-size:18px; box-shadow:var(--shadow)}
#confetti{position:fixed; inset:0; z-index:70; pointer-events:none}

@media (max-width:560px){
  .daily{flex-direction:column; align-items:stretch; text-align:center}
  .daily canvas{width:100%; height:auto; aspect-ratio:4/3}
  .daily .info{align-items:center}
  .playbtn{align-self:center}
  .grid{grid-template-columns:1fr 1fr}
}
@media (prefers-reduced-motion:reduce){
  .card,.playbtn,.piece{transition:none}
  .grid .card:nth-child(odd),.grid .card:nth-child(even){transform:none}
  .daily,#winwrap .win{transform:none}
  .piece.pop{animation:none}
  #gprogFill{transition:none}
}

/* ── 계정 시트 ── */
#acct,#settings,#packview{position:fixed; inset:0; background:rgba(58,66,88,.45); display:flex; align-items:flex-end;
  justify-content:center; z-index:50}
#acct .box,#settings .box,#packview .box{background:var(--panel); border-radius:26px 30px 0 0/30px 26px 0 0; border:3px solid var(--ink);
  border-bottom:0; padding:22px 18px 30px; width:min(560px,100%); display:flex; flex-direction:column; gap:12px}
#acct h3,#settings h3,#packview h3{font-size:22px; text-align:center}
#packGrid{overflow-y:auto; max-height:62vh; -webkit-overflow-scrolling:touch}
.acct-note{margin:0; text-align:center; color:var(--sub); font-size:14px; line-height:1.6; font-family:var(--body)}
.acct-btn{border:3px solid var(--line); border-radius:var(--wob); padding:13px; font-size:18px;
  background:var(--panel); color:var(--sub)}
#acct .cancel,#settings .cancel,#packview .cancel{color:var(--sub); font-size:16px; padding:8px}
</style>

<div id="splash">
  <svg class="tp" style="left:7%;top:9%;width:56px;--r:-14deg;animation-duration:3.2s" viewBox="0 0 40 40" aria-hidden="true"><path fill="#3FBF8F" stroke="#3A4258" stroke-width="2" d="M6 8h10c-3-6 8-6 5 0h11v10c6-3 6 8 0 5v11H22c3 6-8 6-5 0H6V23c-6 3-6-8 0-5z"/></svg>
  <svg class="tp" style="right:9%;top:14%;width:44px;--r:18deg;animation-duration:2.7s;animation-delay:.3s" viewBox="0 0 40 40" aria-hidden="true"><path fill="#F2B01E" stroke="#3A4258" stroke-width="2" d="M6 8h10c-3-6 8-6 5 0h11v10c6-3 6 8 0 5v11H22c3 6-8 6-5 0H6V23c-6 3-6-8 0-5z"/></svg>
  <svg class="tp" style="left:12%;bottom:17%;width:48px;--r:10deg;animation-duration:3.6s;animation-delay:.6s" viewBox="0 0 40 40" aria-hidden="true"><path fill="#7EC8F0" stroke="#3A4258" stroke-width="2" d="M6 8h10c-3-6 8-6 5 0h11v10c6-3 6 8 0 5v11H22c3 6-8 6-5 0H6V23c-6 3-6-8 0-5z"/></svg>
  <svg class="tp" style="right:11%;bottom:11%;width:60px;--r:-8deg;animation-duration:3s;animation-delay:.2s" viewBox="0 0 40 40" aria-hidden="true"><path fill="#FF8A3D" stroke="#3A4258" stroke-width="2" d="M6 8h10c-3-6 8-6 5 0h11v10c6-3 6 8 0 5v11H22c3 6-8 6-5 0H6V23c-6 3-6-8 0-5z"/></svg>
  <svg class="tp" style="left:44%;top:6%;width:36px;--r:24deg;animation-duration:2.9s;animation-delay:.8s" viewBox="0 0 40 40" aria-hidden="true"><path fill="#F7A8C4" stroke="#3A4258" stroke-width="2" d="M6 8h10c-3-6 8-6 5 0h11v10c6-3 6 8 0 5v11H22c3 6-8 6-5 0H6V23c-6 3-6-8 0-5z"/></svg>
  <svg class="tlogo" viewBox="0 0 40 40" aria-hidden="true"><path fill="#FF8A3D" stroke="#3A4258" stroke-width="2" d="M6 8h10c-3-6 8-6 5 0h11v10c6-3 6 8 0 5v11H22c3 6-8 6-5 0H6V23c-6 3-6-8 0-5z"/></svg>
  <div class="sname" id="splashName">이든의 퍼즐</div>
  <button class="tstart" id="titleStart">시작!</button>
</div>

<main id="home">
  <div class="topline">
    <div class="logo">
      <svg viewBox="0 0 40 40" aria-hidden="true"><path fill="#FF8A3D" stroke="#3A4258" stroke-width="2" d="M6 8h10c-3-6 8-6 5 0h11v10c6-3 6 8 0 5v11H22c3 6-8 6-5 0H6V23c-6 3-6-8 0-5z"/></svg>
      <span id="logoName">이든의 퍼즐</span>
    </div>
    <div class="spacer"></div>
    <div class="statgrp" aria-label="기록">
      <span class="seg" title="완성한 퍼즐">🏆 <b id="starN">0</b></span>
      <span class="seg" title="오늘의 퍼즐 연속 기록">🔥 <b id="streakN">0</b></span>
    </div>
    <div class="statgrp" aria-label="코인">
      <span class="seg" title="별코인 — 퍼즐을 맞추면 모여요">⭐ <b id="coinSN">0</b></span>
      <span class="seg" title="무지개코인 — 매일 3개, 프리미엄 그림을 열어요">🌈 <b id="coinRN">3</b></span>
    </div>
    <button class="stat guest" id="acctBtn" aria-label="계정">👤 게스트</button>
    <button class="stat" id="setBtn" aria-label="설정">⚙️</button>
  </div>

  <section class="daily" id="dailyCard">
    <canvas id="dailyThumb" width="400" height="300"></canvas>
    <div class="info">
      <span class="eyebrow" id="dailyEyebrow">오늘의 퍼즐 · 무료</span>
      <h2 id="dailyName">…</h2>
      <span class="date" id="dailyDate"></span>
      <button class="playbtn" id="dailyPlay">맞추러 가기</button>
    </div>
  </section>

  <div class="sect">
    <div class="row"><h2 id="secScenes">그림 고르기</h2><small id="secScenesS">매일 새 그림이 무료로 열려요</small></div>
    <span class="squig"></span>
  </div>
  <div class="grid" id="gallery"></div>

  <div class="sect">
    <div class="row"><h2 id="secArts">명화 퍼즐</h2><span class="chip prem" id="secArtsChip">프리미엄</span><small id="secArtsS">진짜 미술관 그림을 심플하게</small></div>
    <span class="squig"></span>
  </div>
  <div class="grid" id="artGallery"></div>

  <div class="sect">
    <div class="row"><h2 id="secPhoto">사진 퍼즐</h2><span class="chip prem" id="secPhotoChip">프리미엄</span><small id="secPhotoS">그림처럼 바꿔서도 맞출 수 있어요</small></div>
    <span class="squig"></span>
  </div>
  <div class="grid">
    <button class="card photo-card" id="photoBtn">
      <span class="ph" id="photoPh">📷</span>
      <span class="row"><span class="name" id="photoBtnName">사진 고르기</span><span class="chip prem">＋</span></span>
    </button>
    <button class="card" id="lastPhotoCard" hidden>
      <canvas id="lastPhotoThumb" width="400" height="300"></canvas>
      <span class="row"><span class="name" id="lastPhotoName">마지막 사진</span><span class="chip star" id="photoStar"></span></span>
    </button>
  </div>
  <input type="file" id="photoInput" accept="image/*" hidden>

  <p class="note" id="footNote">광고 없음 · 사진도 그림 변환도 전부 기기 안에서만 · 출시 준비 중이라 프리미엄이 모두 열려 있어요</p>
</main>

<div id="settings" hidden>
  <div class="box">
    <h3 id="setTitle">설정</h3>
    <div class="stylerow">
      <button class="stylechip" id="langKo">한국어</button>
      <button class="stylechip" id="langEn">English</button>
    </div>
    <div class="stylerow">
      <button class="stylechip" id="setSnd">🔊</button>
    </div>
    <p class="acct-note" id="buildLine"></p>
    <button class="cancel" id="setCancel">닫기</button>
  </div>
</div>

<div id="packview" hidden>
  <div class="box">
    <h3 id="packTitle"></h3>
    <div class="grid" id="packGrid"></div>
    <button class="cancel" id="packCancel">닫기</button>
  </div>
</div>

<div id="acct" hidden>
  <div class="box">
    <h3 id="acctTitle">계정</h3>
    <p class="acct-note" id="acctNote">지금은 <b>게스트 모드</b> — 진행과 별은 이 기기에 저장돼요.<br>로그인이 열리면 계정으로 이어서 저장할 수 있어요.</p>
    <button class="acct-btn" disabled id="acctG">구글로 계속하기 · 준비 중</button>
    <button class="acct-btn" disabled id="acctA">Apple로 계속하기 · 준비 중</button>
    <button class="cancel" id="acctCancel">닫기</button>
  </div>
</div>

<div id="sheet" hidden>
  <div class="box">

/* ── 그림들: 전부 코드로 그린다 (외부 이미지 0) ── */
function sky(ctx,w,h,c1,c2){const g=ctx.createLinearGradient(0,0,0,h);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}
function disc(ctx,x,y,r,f){ctx.fillStyle=f;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
function blob(ctx,pts,f){ctx.fillStyle=f;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.closePath();ctx.fill()}
function cloud(ctx,x,y,s,f){disc(ctx,x,y,s,f);disc(ctx,x+s*.9,y+s*.15,s*.75,f);disc(ctx,x-s*.9,y+s*.2,s*.7,f);ctx.fillStyle=f;ctx.fillRect(x-s*1.4,y,s*2.8,s*.75)}

function sceneSpace(ctx,w,h){
  sky(ctx,w,h,'#1B2A6B','#3D2E86');
  for(let i=0;i<60;i++)disc(ctx,(i*137)%w,(i*89)%h,(i%3)+1,'rgba(255,255,255,.8)');
  disc(ctx,w*.82,h*.2,h*.11,'#FFD98A');disc(ctx,w*.78,h*.17,h*.03,'#F0BE62');disc(ctx,w*.86,h*.24,h*.02,'#F0BE62');
  disc(ctx,w*.15,h*.72,h*.09,'#7FE3D2');ctx.strokeStyle='#5BC7B4';ctx.lineWidth=h*.02;
  ctx.beginPath();ctx.ellipse(w*.15,h*.72,h*.15,h*.045,-.4,0,7);ctx.stroke();
  const rx=w*.5,ry=h*.55,rw=w*.16,rh=h*.42;      // 로켓
  ctx.fillStyle='#F4F7FF';ctx.beginPath();ctx.moveTo(rx,ry-rh*.62);
  ctx.quadraticCurveTo(rx+rw*.55,ry-rh*.1,rx+rw*.5,ry+rh*.38);ctx.lineTo(rx-rw*.5,ry+rh*.38);
  ctx.quadraticCurveTo(rx-rw*.55,ry-rh*.1,rx,ry-rh*.62);ctx.fill();
  ctx.fillStyle='#FF6B6B';ctx.beginPath();ctx.moveTo(rx,ry-rh*.62);
  ctx.quadraticCurveTo(rx+rw*.38,ry-rh*.28,rx+rw*.42,ry-rh*.12);ctx.lineTo(rx-rw*.42,ry-rh*.12);
  ctx.quadraticCurveTo(rx-rw*.38,ry-rh*.28,rx,ry-rh*.62);ctx.fill();
  blob(ctx,[[rx-rw*.5,ry+rh*.1],[rx-rw*.85,ry+rh*.45],[rx-rw*.5,ry+rh*.38]],'#FF6B6B');
  blob(ctx,[[rx+rw*.5,ry+rh*.1],[rx+rw*.85,ry+rh*.45],[rx+rw*.5,ry+rh*.38]],'#FF6B6B');
  disc(ctx,rx,ry,rw*.28,'#8ED0FF');ctx.strokeStyle='#5A87C7';ctx.lineWidth=w*.008;
  ctx.beginPath();ctx.arc(rx,ry,rw*.28,0,7);ctx.stroke();
  disc(ctx,rx,ry+rh*.52,rw*.3,'#FFB13D');disc(ctx,rx,ry+rh*.58,rw*.2,'#FFDD66');
}
function sceneSea(ctx,w,h){
  sky(ctx,w,h,'#5FD3E8','#1E7FB8');
  for(let i=0;i<5;i++){ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=3;
    ctx.beginPath();ctx.moveTo(0,h*.1+i*h*.04);ctx.quadraticCurveTo(w*.5,h*.06+i*h*.04,w,h*.1+i*h*.04);ctx.stroke()}
  blob(ctx,[[0,h],[0,h*.85],[w*.3,h*.9],[w*.7,h*.82],[w,h*.88],[w,h]],'#F2D48A'); // 모래
  const weed=(x)=>{ctx.strokeStyle='#2E9E6B';ctx.lineWidth=w*.014;ctx.lineCap='round';
    for(let i=-1;i<2;i++){ctx.beginPath();ctx.moveTo(x,h*.9);
      ctx.quadraticCurveTo(x+i*w*.04,h*.72,x+i*w*.02,h*.6);ctx.stroke()}};
  weed(w*.12);weed(w*.88);
  const fish=(x,y,s,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(x,y,s,s*.6,0,0,7);ctx.fill();
    blob(ctx,[[x-s*.9,y],[x-s*1.5,y-s*.5],[x-s*1.5,y+s*.5]],c);
    disc(ctx,x+s*.45,y-s*.1,s*.1,'#243');disc(ctx,x+s*.48,y-s*.13,s*.035,'#fff')};
  fish(w*.35,h*.35,w*.075,'#FF8A3D');fish(w*.65,h*.55,w*.06,'#FFD23D');fish(w*.28,h*.62,w*.05,'#B28AF0');
  for(let i=0;i<8;i++)disc(ctx,(i*113%w),(i*71%Math.floor(h*.5))+h*.08,3+i%4,'rgba(255,255,255,.5)');
  disc(ctx,w*.82,h*.85,w*.05,'#F06A5E');disc(ctx,w*.775,h*.81,w*.016,'#243');disc(ctx,w*.865,h*.81,w*.016,'#243'); // 게
}
function sceneDino(ctx,w,h){
  sky(ctx,w,h,'#BDEBFF','#E8F9E8');
  cloud(ctx,w*.2,h*.16,h*.05,'#fff');cloud(ctx,w*.75,h*.1,h*.04,'#fff');
  blob(ctx,[[w*.62,h*.62],[w*.78,h*.28],[w*.94,h*.62]],'#B08968');            // 화산
  blob(ctx,[[w*.74,h*.36],[w*.78,h*.28],[w*.82,h*.36]],'#FF7B4D');
  disc(ctx,w*.3,h*.85,h*.5,'#9FDD8E');disc(ctx,w*.85,h*.95,h*.45,'#8CD07E');  // 언덕
  ctx.fillStyle='#5FBF7A';                                                     // 공룡
  ctx.beginPath();ctx.ellipse(w*.38,h*.66,w*.15,h*.13,0,0,7);ctx.fill();
  ctx.beginPath();ctx.moveTo(w*.49,h*.6);ctx.quadraticCurveTo(w*.58,h*.32,w*.64,h*.3);
  ctx.quadraticCurveTo(w*.6,h*.44,w*.55,h*.68);ctx.fill();
  disc(ctx,w*.645,h*.3,w*.042,'#5FBF7A');
  ctx.beginPath();ctx.moveTo(w*.27,h*.62);ctx.quadraticCurveTo(w*.14,h*.66,w*.1,h*.78);
  ctx.quadraticCurveTo(w*.2,h*.74,w*.29,h*.72);ctx.fill();
  ctx.fillRect(w*.31,h*.72,w*.035,h*.14);ctx.fillRect(w*.42,h*.72,w*.035,h*.14);
  disc(ctx,w*.655,h*.29,w*.008,'#243');
  for(const [fx,fy] of [[.2,.9],[.55,.92],[.7,.88]])
    {disc(ctx,w*fx,h*fy,w*.012,'#FF9BC0');disc(ctx,w*fx+w*.02,h*fy,w*.012,'#FFD23D')}
}
function sceneBalloon(ctx,w,h){
  sky(ctx,w,h,'#FFD9A0','#FF9E7A');
  disc(ctx,w*.5,h*.95,h*.22,'#FFE9B8');
  const hill=(x,r,c)=>disc(ctx,x,h*1.12,r,c);
  hill(w*.2,h*.4,'#8CBF6E');hill(w*.75,h*.45,'#7AB05F');
  const bal=(x,y,s,c1,c2)=>{
    ctx.fillStyle=c1;ctx.beginPath();ctx.arc(x,y,s,0,7);ctx.fill();
    ctx.fillStyle=c2;ctx.beginPath();ctx.ellipse(x,y,s*.4,s,0,0,7);ctx.fill();
    ctx.strokeStyle='#7A5A3A';ctx.lineWidth=s*.06;
    ctx.beginPath();ctx.moveTo(x-s*.5,y+s*.8);ctx.lineTo(x-s*.3,y+s*1.35);
    ctx.moveTo(x+s*.5,y+s*.8);ctx.lineTo(x+s*.3,y+s*1.35);ctx.stroke();
    ctx.fillStyle='#B07A45';ctx.fillRect(x-s*.32,y+s*1.3,s*.64,s*.42)};
  bal(w*.32,h*.34,h*.14,'#FF6B6B','#FFD23D');
  bal(w*.68,h*.24,h*.1,'#5FA8FF','#B7E3FF');
  bal(w*.55,h*.56,h*.07,'#B28AF0','#FFC1E0');
  ctx.strokeStyle='#5A4632';ctx.lineWidth=3;
  for(const [bx,by] of [[.12,.2],[.16,.22],[.85,.5]]){
    ctx.beginPath();ctx.moveTo(w*bx-12,h*by);ctx.quadraticCurveTo(w*bx,h*by-10,w*bx+12,h*by);ctx.stroke()}
}
function sceneFarm(ctx,w,h){
  sky(ctx,w,h,'#AEE4FF','#DFF6FF');
  disc(ctx,w*.85,h*.16,h*.09,'#FFD23D');
  cloud(ctx,w*.3,h*.14,h*.045,'#fff');
  blob(ctx,[[0,h],[0,h*.55],[w,h*.62],[w,h]],'#9FD87E');
  ctx.fillStyle='#E85D4A';ctx.fillRect(w*.58,h*.34,w*.26,h*.26);                // 헛간
  blob(ctx,[[w*.55,h*.34],[w*.71,h*.2],[w*.87,h*.34]],'#B33F30');
  ctx.fillStyle='#fff';ctx.fillRect(w*.66,h*.44,w*.1,h*.16);
  ctx.strokeStyle='#B33F30';ctx.lineWidth=4;ctx.strokeRect(w*.66,h*.44,w*.1,h*.16);
  ctx.beginPath();ctx.moveTo(w*.66,h*.44);ctx.lineTo(w*.76,h*.6);ctx.moveTo(w*.76,h*.44);ctx.lineTo(w*.66,h*.6);ctx.stroke();
  const sheep=(x,y,s)=>{cloud(ctx,x,y,s,'#fff');disc(ctx,x+s*1.5,y+s*.2,s*.55,'#4A4A5A');
    disc(ctx,x+s*1.7,y+s*.05,s*.1,'#fff');
    ctx.fillStyle='#4A4A5A';ctx.fillRect(x-s,y+s*.7,s*.22,s*.7);ctx.fillRect(x+s*.7,y+s*.7,s*.22,s*.7)};
  sheep(w*.22,h*.72,h*.05);sheep(w*.42,h*.8,h*.06);
  for(const fx of [.08,.13,.5,.9])
    {disc(ctx,w*fx,h*.68,w*.011,'#FF9BC0');ctx.strokeStyle='#5FA054';ctx.lineWidth=3;
     ctx.beginPath();ctx.moveTo(w*fx,h*.68);ctx.lineTo(w*fx,h*.73);ctx.stroke()}
}
function sceneFirework(ctx,w,h){
  sky(ctx,w,h,'#141B4D','#33246B');
  disc(ctx,w*.12,h*.14,h*.07,'#FFF3C4');
  const burst=(x,y,r,c)=>{ctx.strokeStyle=c;ctx.lineWidth=4;ctx.lineCap='round';
    for(let i=0;i<12;i++){const a=i/12*Math.PI*2;
      ctx.beginPath();ctx.moveTo(x+Math.cos(a)*r*.35,y+Math.sin(a)*r*.35);
      ctx.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r);ctx.stroke();
      disc(ctx,x+Math.cos(a)*r,y+Math.sin(a)*r,3.5,c)}};
  burst(w*.35,h*.28,h*.16,'#FF8A3D');burst(w*.68,h*.2,h*.12,'#7FE3D2');
  burst(w*.82,h*.45,h*.09,'#FF9BC0');burst(w*.2,h*.5,h*.07,'#FFD23D');
  ctx.fillStyle='#0B0F33';                                                       // 도시
  const bh=[.18,.3,.22,.38,.26,.2,.33,.24];
  bh.forEach((b,i)=>{const bw=w/bh.length;ctx.fillRect(i*bw,h-h*b,bw-4,h*b)});
  ctx.fillStyle='#FFE9A0';
  bh.forEach((b,i)=>{const bw=w/bh.length;
    for(let win=0;win<3;win++)ctx.fillRect(i*bw+bw*.2+win*bw*.22,h-h*b+h*.04,bw*.1,h*.03)});
}

/* ── 명화 팩: 퍼블릭 도메인 원작의 심플 버전 (전부 코드 드로잉) ── */
function artStarry(ctx,w,h){
  sky(ctx,w,h,'#1A2B5F','#274690');
  const swirl=(sx,sy,rr)=>{ctx.strokeStyle='#F5E27A';ctx.lineWidth=w*.012;ctx.lineCap='round';
    ctx.beginPath();
    for(let a=0;a<Math.PI*4;a+=.15){const rad=rr*(1-a/(Math.PI*4.4));
      const x=sx+Math.cos(a)*rad,y=sy+Math.sin(a)*rad*.7;
      a===0?ctx.moveTo(x,y):ctx.lineTo(x,y)}
    ctx.stroke()};
  swirl(w*.42,h*.28,w*.13);swirl(w*.68,h*.2,w*.08);
  for(let i=0;i<9;i++){const px2=(i*97)%w,py2=(i*53)%Math.floor(h*.45)+h*.05;
    disc(ctx,px2,py2,w*.02,'rgba(245,226,122,.25)');disc(ctx,px2,py2,w*.011,'#F5E27A')}
  disc(ctx,w*.87,h*.14,w*.075,'rgba(245,226,122,.3)');disc(ctx,w*.87,h*.14,w*.05,'#F5E27A');
  blob(ctx,[[0,h],[0,h*.72],[w*.3,h*.66],[w*.65,h*.74],[w,h*.68],[w,h]],'#152238');
  ctx.fillStyle='#1F3352';
  for(const hp of [[.14,.07,.08],[.3,.08,.1],[.52,.07,.07],[.72,.09,.09]])
    ctx.fillRect(w*hp[0],h*(.82-hp[2]),w*hp[1],h*hp[2]);
  ctx.fillStyle='#F5E27A';
  for(const wp of [[.16,.78],[.33,.76],[.54,.79],[.75,.77]])ctx.fillRect(w*wp[0],h*wp[1],w*.018,h*.025);
  blob(ctx,[[w*.4,h*.78],[w*.43,h*.58],[w*.46,h*.78]],'#1F3352');
  blob(ctx,[[w*.08,h*.95],[w*.13,h*.2],[w*.18,h*.95]],'#0B1A12');
  blob(ctx,[[w*.09,h*.6],[w*.13,h*.12],[w*.17,h*.6]],'#0B1A12');
}
function artWave(ctx,w,h){
  sky(ctx,w,h,'#F2E8D5','#E8DCC0');
  blob(ctx,[[w*.55,h*.62],[w*.7,h*.4],[w*.85,h*.62]],'#7A87A8');
  blob(ctx,[[w*.63,h*.51],[w*.7,h*.4],[w*.77,h*.51]],'#F4F6F8');
  ctx.fillStyle='#1F4E79';
  ctx.beginPath();ctx.moveTo(0,h);
  ctx.quadraticCurveTo(0,h*.35,w*.18,h*.22);
  ctx.quadraticCurveTo(w*.42,h*.05,w*.5,h*.28);
  ctx.quadraticCurveTo(w*.44,h*.2,w*.36,h*.26);
  ctx.quadraticCurveTo(w*.52,h*.42,w*.75,h*.6);
  ctx.quadraticCurveTo(w*.5,h*.75,0,h);
  ctx.closePath();ctx.fill();
  for(let i=0;i<8;i++){const bx2=w*(.2+i*.045),by2=h*(.2+(i%3)*.03);
    disc(ctx,bx2,by2,w*.022,'#F4F6F8');disc(ctx,bx2+w*.02,by2+h*.03,w*.014,'#F4F6F8')}
  ctx.fillStyle='#2E6DA4';
  ctx.beginPath();ctx.moveTo(w,h);ctx.lineTo(w,h*.66);
  ctx.quadraticCurveTo(w*.8,h*.6,w*.7,h*.7);ctx.quadraticCurveTo(w*.55,h*.85,0,h*.9);
  ctx.lineTo(0,h);ctx.closePath();ctx.fill();
  const boat=(bx3,by3,s)=>{ctx.fillStyle='#8B6A45';
    ctx.beginPath();ctx.moveTo(bx3-s,by3);ctx.quadraticCurveTo(bx3,by3+s*.5,bx3+s,by3);
    ctx.quadraticCurveTo(bx3,by3+s*.2,bx3-s,by3);ctx.fill()};
  boat(w*.6,h*.72,w*.09);boat(w*.3,h*.86,w*.1);
}
function artJungle(ctx,w,h){
  sky(ctx,w,h,'#DCEEC8','#BFE39E');
  disc(ctx,w*.8,h*.18,h*.09,'#F7E8B0');
  const leaf=(x,y,len,ang,col)=>{ctx.save();ctx.translate(x,y);ctx.rotate(ang);
    ctx.fillStyle=col;ctx.beginPath();ctx.ellipse(0,-len/2,len*.18,len/2,0,0,7);ctx.fill();
    ctx.strokeStyle='rgba(0,60,30,.35)';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,-len);ctx.stroke();ctx.restore()};
  const greens=['#2E7D4F','#3E9960','#256B43','#4CAF6E'];
  for(let i=0;i<16;i++)
    leaf(w*((i*.07)%1),h*(.65+(i%4)*.08),h*(.3+(i%3)*.12),(i%2?.5:-.5)+(i%5)*.15,greens[i%4]);
  const tx2=w*.5,ty2=h*.62;
  ctx.fillStyle='#E8923A';
  ctx.beginPath();ctx.ellipse(tx2,ty2,w*.16,h*.13,0,0,7);ctx.fill();
  disc(ctx,tx2-w*.13,ty2-h*.1,w*.075,'#E8923A');
  disc(ctx,tx2-w*.185,ty2-h*.16,w*.022,'#E8923A');disc(ctx,tx2-w*.075,ty2-h*.16,w*.022,'#E8923A');
  ctx.strokeStyle='#4A3320';ctx.lineWidth=w*.012;ctx.lineCap='round';
  for(let i=0;i<5;i++){ctx.beginPath();ctx.moveTo(tx2-w*.04+i*w*.045,ty2-h*.1);
    ctx.quadraticCurveTo(tx2-w*.03+i*w*.045,ty2,tx2-w*.045+i*w*.045,ty2+h*.09);ctx.stroke()}
  disc(ctx,tx2-w*.155,ty2-h*.115,w*.008,'#243');disc(ctx,tx2-w*.105,ty2-h*.115,w*.008,'#243');
  disc(ctx,tx2-w*.13,ty2-h*.07,w*.03,'rgba(255,255,255,.6)');
  disc(ctx,tx2-w*.13,ty2-h*.085,w*.01,'#4A3320');
  for(let i=0;i<22;i++)leaf(w*(i/22),h*1.02,h*.28,(i%2?.25:-.25),greens[(i+1)%4]);
}

let audioCtx=null, soundOn=store.get('snd',true);
function beep(freq,dur,when=0,vol=.15){
  if(!soundOn)return;
  try{
    audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();
    const t=audioCtx.currentTime+when, o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type='sine';o.frequency.value=freq;
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g);g.connect(audioCtx.destination);o.start(t);o.stop(t+dur);
  }catch(e){}
}

/* ── 사진 → 그림 변환 (전부 기기 안: 포스터라이즈 + 윤곽선) ── */
let photoImg=null, photoArt=null, photoStyle=store.get('photoStyle','art');
function cartoonize(img){
  const cv=document.createElement('canvas');cv.width=IW;cv.height=IH;
  const ctx=cv.getContext('2d');
  try{ctx.filter='blur(1.2px) saturate(1.6)'}catch(e){}
  ctx.drawImage(img,0,0,IW,IH);
  try{ctx.filter='none'}catch(e){}
  const id=ctx.getImageData(0,0,IW,IH), d=id.data, n=IW*IH;
  const lum=new Float32Array(n);
  for(let i=0;i<n;i++)lum[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;
  const step=255/4;                                    // 5단계 포스터라이즈
  for(let i=0;i<d.length;i+=4){
    d[i]=Math.round(d[i]/step)*step;
    d[i+1]=Math.round(d[i+1]/step)*step;
    d[i+2]=Math.round(d[i+2]/step)*step;
  }
  for(let y=1;y<IH-1;y++)for(let x=1;x<IW-1;x++){       // 윤곽선
    const i=y*IW+x, gx=lum[i+1]-lum[i-1], gy=lum[i+IW]-lum[i-IW];
    if(gx*gx+gy*gy>1100){const j=i*4;d[j]*=.3;d[j+1]*=.3;d[j+2]*=.3}
  }
  ctx.putImageData(id,0,0);
  return cv;
}
function photoSource(){
  if(photoStyle==='art'&&photoImg){
    if(!photoArt)photoArt=cartoonize(photoImg);
    return photoArt;
  }
  return photoImg;
}

/* ── 씬 이미지 에셋: 캐시 + 로드 대기 (실패하면 코드 드로잉 폴백) ── */
const IMGS={};
function ensureImg(sc){return new Promise(res=>{
  if(!sc||!sc.img)return res();
  let e=IMGS[sc.id];
  if(!e){e=IMGS[sc.id]={img:new Image(),ok:false,done:false,waiters:[]};
    e.img.onload=()=>{e.ok=true;e.done=true;e.waiters.splice(0).forEach(f=>f())};
    e.img.onerror=()=>{e.done=true;e.waiters.splice(0).forEach(f=>f())};
    e.img.src=sc.img}
  if(e.done)return res();
  const tm=setTimeout(res,3000);
  e.waiters.push(()=>{clearTimeout(tm);res()});
})}

/* ── 렌더 소스: 그림 or 사진을 W×H로 그린다 ── */
function makeRenderer(sid){
  if(sid==='photo')return (ctx,w,h)=>{
    const src=photoSource();
    if(!src){ctx.fillStyle='#ccc';ctx.fillRect(0,0,w,h);return}
    ctx.drawImage(src,0,0,src.width,src.height,0,0,w,h);
  };
  const sc=findScene(sid);
  return (ctx,w,h)=>{
    const e=sc.img&&IMGS[sc.id];
    if(e&&e.ok)ctx.drawImage(e.img,0,0,w,h);
    else if(sc.draw)sc.draw(ctx,w,h);
    else{ctx.fillStyle='#EFE8DA';ctx.fillRect(0,0,w,h)}   // 이미지 로드 전 플레이스홀더
  };
}
function paintThumb(canvas,sid){
  const ctx=canvas.getContext('2d');
  ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,canvas.width,canvas.height);
  makeRenderer(sid)(ctx,canvas.width,canvas.height);
}

/* ── 시드 랜덤 (진행 저장 복원 시 같은 요철 재생성) ── */
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

/* ── 직소 요철 경로: 컷 스타일별 세그먼트 (u,v 파라미터 공간) ── */
function edgeSegs(e){
  if(G.cut==='wave'){const a=e.wv;
    return [['C',[.25,a],[.4,a],[.5,0]],['C',[.6,-a],[.75,-a],[1,0]]]}
  const bub=G.cut==='bubble', w=e.w*(bub?1.1:1), h=e.h*(bub?1.15:1);
  const X=x=>e.u+(x-.5)*w, V=v=>v*h;
  // 좁은 목 + 둥근 원형 노브 (진짜 다이컷 퍼즐 실루엣): 노브 중심 (.5,.20) 반지름 .13
  return [
    ['Q',[X(.34)*.5,e.a],[X(.34),0]],
    ['C',[X(.44),V(.01)],[X(.45),V(.06)],[X(.408),V(.108)]],
    ['C',[X(.384),V(.132)],[X(.37),V(.166)],[X(.37),V(.20)]],
    ['C',[X(.37),V(.272)],[X(.428),V(.33)],[X(.5),V(.33)]],
    ['C',[X(.572),V(.33)],[X(.63),V(.272)],[X(.63),V(.20)]],
    ['C',[X(.63),V(.166)],[X(.616),V(.132)],[X(.592),V(.108)]],
    ['C',[X(.55),V(.06)],[X(.56),V(.01)],[X(.66),0]],
    ['Q',[(X(.66)+1)*.5,e.b],[1,0]]
  ]
}
/* 같은 엣지를 양쪽 피스가 공유 — flip이면 (1-u)·역순으로 그려 정확히 맞물린다 */
function jigEdge(ctx,ax,ay,bx,by,e,flip){
  if(!e){ctx.lineTo(bx,by);return}
  const dx=bx-ax, dy=by-ay, sgn=(flip?-1:1)*e.d;
  // 노브 크기는 엣지 길이가 아니라 짧은 변 기준으로 통일 — 가로·세로 노브가 같은 크기
  const ks=(G.kl||Math.hypot(dx,dy))/Math.hypot(dx,dy);
  const P=pt=>{const uu=flip?1-pt[0]:pt[0], v=pt[1]*sgn*ks;
    return [ax+dx*uu+dy*v, ay+dy*uu-dx*v]};
  const segs=edgeSegs(e);
  if(!flip){
    for(const s of segs){
      if(s[0]==='Q'){const c=P(s[1]),p=P(s[2]);ctx.quadraticCurveTo(c[0],c[1],p[0],p[1])}
      else{const c1=P(s[1]),c2=P(s[2]),p=P(s[3]);ctx.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],p[0],p[1])}
    }
  }else{
    const starts=[[0,0]];
    for(let i=0;i<segs.length-1;i++){const s=segs[i];starts.push(s[s.length-1])}
    for(let i=segs.length-1;i>=0;i--){const s=segs[i],st=P(starts[i]);
      if(s[0]==='Q'){const c=P(s[1]);ctx.quadraticCurveTo(c[0],c[1],st[0],st[1])}
      else{const c1=P(s[2]),c2=P(s[1]);ctx.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],st[0],st[1])}
    }
  }
}

function layoutGame(){
  if(!G.on)return;
  const arena=$('arena'), aw=arena.clientWidth, ah=arena.clientHeight;
  if(aw<50||ah<50){setTimeout(layoutGame,120);return}
  const availW=aw-28, availH=ah*(G.cols*G.rows>=24?.52:.62);   // 조각 많을수록 트레이 넓게
  let bw=availW, bh=bw*IH/IW;
  if(bh>availH){bh=availH;bw=bh*IW/IH}
  G.bw=bw;G.bh=bh;G.bx=(aw-bw)/2;G.by=12;
  const board=$('board');
  board.style.left=G.bx+'px';board.style.top=G.by+'px';
  board.style.width=bw+'px';board.style.height=bh+'px';
  const R=Math.min(2,window.devicePixelRatio||1);
  const ghost=$('ghost');ghost.width=bw*R;ghost.height=bh*R;
  const gc=ghost.getContext('2d');gc.setTransform(R,0,0,R,0,0);
  gc.globalAlpha=.16;G.render(gc,bw,bh);gc.globalAlpha=1;
  const peek=$('peek');peek.hidden=true;peek.width=bw*R;peek.height=bh*R;
  const pkc=peek.getContext('2d');pkc.setTransform(R,0,0,R,0,0);G.render(pkc,bw,bh);
  gc.strokeStyle='rgba(58,66,88,.18)';gc.setLineDash([5,5]);gc.lineWidth=1;
  G.pw=bw/G.cols;G.ph=bh/G.rows;
  computeGeometry();
  const PX=G.PX,PY=G.PY;
  for(let c=1;c<G.cols;c++){gc.beginPath();gc.moveTo(PX[0][c],PY[0][c]);
    for(let r=1;r<=G.rows;r++)gc.lineTo(PX[r][c],PY[r][c]);gc.stroke()}
  for(let r=1;r<G.rows;r++){gc.beginPath();gc.moveTo(PX[r][0],PY[r][0]);
    for(let c=1;c<=G.cols;c++)gc.lineTo(PX[r][c],PY[r][c]);gc.stroke()}
  buildPieces(arena,R);
  updateCount();
}
function computeGeometry(){
  const rand=rng(G.seed);
  const {cols,rows,pw,ph}=G;
  // 컷 스타일: 판(seed)마다 다르게 — 클래식 직소 / 물결 / 통통 버블
  // 성철 지시 9/8: 일단 standard만. 다른 스타일 재개 조건 = 직선 구간까지 곡선화 (roll 소비는 seed 스트림 유지용)
  const roll=rand();G.cut='standard';
  // 공유 요철 맵: H[r][c]=피스(r,c) 위쪽 변, V[r][c]=왼쪽 변. 엣지마다 탭 위치·폭·높이·어깨 곡률이 다르다
  const std=G.cut==='standard';
  // standard = 진짜 퍼즐처럼: 탭 정중앙·대칭·균일 (방향만 랜덤)
  const mkE=()=>std?{d:rand()<.5?1:-1, u:.5, w:1, h:1, a:0, b:0, wv:0}
    :({d:rand()<.5?1:-1, u:.47+rand()*.06, w:.8+rand()*.35, h:.8+rand()*.35,
    a:(rand()-.5)*.06, b:(rand()-.5)*.06, wv:(rand()<.5?1:-1)*(.07+rand()*.08)});
  const H=[],V=[];
  for(let r=0;r<=rows;r++){H[r]=[];for(let c=0;c<cols;c++)H[r][c]=(r===0||r===rows)?0:mkE()}
  for(let r=0;r<rows;r++){V[r]=[];for(let c=0;c<=cols;c++)V[r][c]=(c===0||c===cols)?0:mkE()}
  // 꼭짓점 지터: 내부 격자점을 흔들어 조각 크기·모양을 제각각으로 (테두리는 고정, standard는 반듯한 격자)
  G.kl=Math.min(pw,ph);
  const j=(std?0:.26)*Math.min(pw,ph), PX=[], PY=[];
  for(let r=0;r<=rows;r++){PX[r]=[];PY[r]=[];
    for(let c=0;c<=cols;c++){
      PX[r][c]=c*pw+((c===0||c===cols)?0:(rand()-.5)*j);
      PY[r][c]=r*ph+((r===0||r===rows)?0:(rand()-.5)*j);
    }}
  G.H=H;G.V=V;G.PX=PX;G.PY=PY;
}
function quadPath(ctx,q,e){
  ctx.beginPath();ctx.moveTo(q[0][0],q[0][1]);
  jigEdge(ctx,q[0][0],q[0][1],q[1][0],q[1][1],e.t,false);
  jigEdge(ctx,q[1][0],q[1][1],q[2][0],q[2][1],e.r,false);
  jigEdge(ctx,q[2][0],q[2][1],q[3][0],q[3][1],e.b,true);
  jigEdge(ctx,q[3][0],q[3][1],q[0][0],q[0][1],e.l,true);
  ctx.closePath();
}
function buildPieces(arena,R){
  arena.querySelectorAll('.piece').forEach(el=>el.remove());
  const {cols,rows,pw,ph,H,V,PX,PY}=G;
  const bleed=Math.ceil(.48*Math.max(pw,ph))+1;G.bleed=bleed;   // 지터+요철 여유
  const savedSet=new Set(G.savedPlaced||[]);
  G.pieces=[];G.placed=0;G.zTop=10;
  const trayTop=G.by+G.bh+10, trayH=Math.max(60,arena.clientHeight-trayTop-10);
  const scatter=rng(G.seed^0x9E3779B9);
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const idx=r*cols+c;
    const e={t:H[r][c], r:V[r][c+1], b:H[r+1][c], l:V[r][c]};
    const q0=[[PX[r][c],PY[r][c]],[PX[r][c+1],PY[r][c+1]],
              [PX[r+1][c+1],PY[r+1][c+1]],[PX[r+1][c],PY[r+1][c]]];
    const minx=Math.min(q0[0][0],q0[1][0],q0[2][0],q0[3][0]);
    const maxx=Math.max(q0[0][0],q0[1][0],q0[2][0],q0[3][0]);
    const miny=Math.min(q0[0][1],q0[1][1],q0[2][1],q0[3][1]);
    const maxy=Math.max(q0[0][1],q0[1][1],q0[2][1],q0[3][1]);
    const bwp=maxx-minx, bhp=maxy-miny;
    const cw=bwp+bleed*2, ch=bhp+bleed*2;
    const q=q0.map(pt=>[pt[0]-minx+bleed,pt[1]-miny+bleed]);
    const cv=document.createElement('canvas');
    cv.width=Math.round(cw*R);cv.height=Math.round(ch*R);
    cv.style.width=cw+'px';cv.style.height=ch+'px';cv.className='piece';
    const cx=cv.getContext('2d');cx.setTransform(R,0,0,R,0,0);
    quadPath(cx,q,e);
    cx.save();cx.clip();
    cx.translate(bleed-minx,bleed-miny);G.render(cx,G.bw,G.bh);
    cx.restore();
    quadPath(cx,q,e);
    cx.strokeStyle='rgba(255,255,255,.85)';cx.lineWidth=1.6;cx.stroke();
    const p={idx,el:cv,tx:G.bx+minx,ty:G.by+miny,pw:bwp,ph:bhp,placed:false};
    if(savedSet.has(idx)){
      p.placed=true;G.placed++;cv.classList.add('placed');
      setPos(p,p.tx,p.ty);
    }else{
      const fx=14+scatter()*(arena.clientWidth-cw-28);
      const fy=trayTop+scatter()*Math.max(10,trayH-ch);
      setPos(p,fx,fy);
      if(!reduceMotion)cv.style.transform='rotate('+((scatter()*12-6)|0)+'deg)';
      cv.style.zIndex=2+((scatter()*8)|0);
      attachDrag(p);
    }
    arena.appendChild(cv);
    G.pieces.push(p);
  }
}
function setPos(p,x,y){p.x=x;p.y=y;p.el.style.left=(x-G.bleed)+'px';p.el.style.top=(y-G.bleed)+'px'}
function attachDrag(p){
  const el=p.el;
  el.addEventListener('pointerdown',ev=>{
    if(p.placed)return;
    ev.preventDefault();el.setPointerCapture(ev.pointerId);
    el.classList.add('drag');el.style.transform='';el.style.zIndex=++G.zTop;
    const offX=ev.clientX-p.x, offY=ev.clientY-p.y;
    const move=e2=>{
      const ar=$('arena');
      setPos(p,
        Math.min(Math.max(e2.clientX-offX,2-G.bleed),ar.clientWidth-p.pw-2),
        Math.min(Math.max(e2.clientY-offY,2-G.bleed),ar.clientHeight-p.ph-2));
    };
    const up=()=>{
      el.classList.remove('drag');
      el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);
      el.removeEventListener('pointercancel',up);
      const d=Math.hypot(p.x-p.tx,p.y-p.ty);
      if(d<Math.min(p.pw,p.ph)*.45){
        p.placed=true;G.placed++;setPos(p,p.tx,p.ty);
        el.classList.add('placed');el.classList.add('pop');
        popSnd(G.placed/G.pieces.length);saveProg();updateCount();
        if(G.placed===G.pieces.length)setTimeout(win,300);
      }
    };
    el.addEventListener('pointermove',move);
    el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  });
}
function updateCount(){
  $('gcount').textContent=G.placed+' / '+G.pieces.length;
  $('gprogFill').style.width=(G.pieces.length?100*G.placed/G.pieces.length:0)+'%';
}
let peekT=null;
$('peekBtn').onclick=()=>{
  const pk=$('peek');pk.hidden=false;
  clearTimeout(peekT);peekT=setTimeout(()=>{pk.hidden=true},1600);
};
function saveProg(){
  store.set(progKey(),{seed:G.seed,placed:G.pieces.filter(p=>p.placed).map(p=>p.idx)});
}
function win(){
  store.del(progKey());
  const wp=$('winPic');wp.hidden=false;
  G.render(wp.getContext('2d'),wp.width,wp.height);
  const stars=store.get('stars',0)+1;store.set('stars',stars);$('starN').textContent=stars;
  const gain=G.pieces.length>=48?3:G.pieces.length>=24?2:1;  // 클수록 별코인 많이
  addCoinS(gain);$('winCoins').textContent='⭐ +'+gain;
  const done=store.get('done',{});done[G.sid]=true;store.set('done',done);
  if(G.isDaily){
    const today=dayStamp(), st=store.get('streak',{last:'',n:0});
    if(st.last!==today){
      const y=new Date();y.setDate(y.getDate()-1);
      st.n=(st.last===dayStamp(y))?st.n+1:1;st.last=today;store.set('streak',st);
    }
    $('streakN').textContent=st.n;
  }
  winSnd();$('winwrap').hidden=false;confetti();renderHome();
}
$('winAgain').onclick=()=>{try{
  if(G.prem&&!spendRain()){$('winwrap').hidden=true;closeGame();return}  // 새 판도 프리미엄이면 1개
  $('winwrap').hidden=true;G.savedPlaced=[];G.seed=(Math.random()*1e9)|0;layoutGame()}catch(e){closeGame()}};
$('winHome').onclick=()=>{$('winwrap').hidden=true;closeGame()};
$('backBtn').onclick=()=>closeGame();
function goHome(){
  G.on=false;
  for(const id of ['game','winwrap','sheet','acct','settings','packview','splash'])try{$(id).hidden=true}catch(e){}
  $('panicHome').hidden=true;
  $('home').hidden=false;
  renderHome();
}
function closeGame(){goHome()}
$('panicHome').onclick=goHome;
function pushUI(tag){try{history.pushState({ui:tag},'')}catch(e){}}
addEventListener('popstate',()=>{
  if(!$('sheet').hidden||!$('acct').hidden||!$('settings').hidden||!$('packview').hidden){$('sheet').hidden=true;$('acct').hidden=true;$('settings').hidden=true;$('packview').hidden=true;return}
  if(!$('winwrap').hidden||G.on)goHome();
});
let rsT=null;
addEventListener('resize',()=>{if(!G.on)return;
  G.savedPlaced=G.pieces.filter(p=>p.placed).map(p=>p.idx);
  clearTimeout(rsT);rsT=setTimeout(layoutGame,180)});

/* ── 폭죽 ── */
function confetti(){
  if(reduceMotion)return;
  const cv=$('confetti');cv.hidden=false;
  cv.width=innerWidth;cv.height=innerHeight;
  const ctx=cv.getContext('2d');
  const cols=['#FF8A3D','#3FBF8F','#F2B01E','#5FA8FF','#FF9BC0'];
  const ps=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,
    v:2+Math.random()*3,w:6+Math.random()*6,a:Math.random()*6,c:cols[(Math.random()*cols.length)|0]}));
  const t0=performance.now();
  (function tick(t){
    ctx.clearRect(0,0,cv.width,cv.height);
    for(const p of ps){p.y+=p.v;p.a+=.05;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);
      ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.w/2,p.w,p.w*.6);ctx.restore()}
    if(t-t0<2600)requestAnimationFrame(tick);else cv.hidden=true;
  })(t0);
}

/* ── 코인: 별코인(완성 보상) + 무지개코인(매일 3개, 프리미엄 입장권) ── */
const RAIN_DAILY=3;
function coinS(){return store.get('coinS',0)}
function addCoinS(n){store.set('coinS',coinS()+n)}
function rainState(){
  const k=dayStamp();let r=store.get('coinR',null);
  if(!r||r.d!==k){r={d:k,n:RAIN_DAILY};store.set('coinR',r)}  // 자정 지나면 3개로 리필, 이월 없음
  return r;
}
function spendRain(){const r=rainState();if(r.n<=0)return false;r.n--;store.set('coinR',r);syncCoins();return true}
function isPrem(sid,isDaily){return !isDaily&&(sid==='photo'||!(findScene(sid)||{}).free)}
function syncCoins(){$('coinSN').textContent=coinS();$('coinRN').textContent=rainState().n}

/* ── 조각 수 시트 ── */
let pendingSid=null, pendingDaily=false;
function syncStyleChips(){
  $('chipRaw').classList.toggle('on',photoStyle==='raw');
  $('chipArt').classList.toggle('on',photoStyle==='art');
}
function setPhotoStyle(s){
  photoStyle=s;store.set('photoStyle',s);syncStyleChips();
  if(photoImg){paintThumb($('lastPhotoThumb'),'photo')}
}
$('chipRaw').onclick=()=>setPhotoStyle('raw');
$('chipArt').onclick=()=>setPhotoStyle('art');
function openSheet(sid,isDaily){
  $('winwrap').hidden=true;pushUI('sheet');
  pendingSid=sid;pendingDaily=isDaily;
  const nm=sid==='photo'?t('photoName'):sceneName(findScene(sid));
  $('sheetTitle').textContent=nm+' — '+t('howMany');
  $('styleRow').hidden=sid!=='photo';
  if(sid==='photo')syncStyleChips();
  const prem=isPrem(sid,isDaily), coinEl=$('sheetCoin');
  coinEl.classList.remove('deny','shake');
  coinEl.hidden=!prem;
  if(prem)coinEl.textContent=t('sheetRain').replace('{n}',rainState().n);
  const box=$('sheetOpts');box.innerHTML='';
  for(const cnt of COUNTS){
    try{
      const saved=store.get('pp:'+sid+':'+cnt.c+'x'+cnt.r,null);
      const hasResume=!!(saved&&Array.isArray(saved.placed)&&saved.placed.length);
      const b=document.createElement('button');b.className='opt';
      b.innerHTML='<span>'+cnt.n+t('pcs')+'</span><small>'+t('tag'+cnt.n)+'</small>'+
        (hasResume?'<span class="resume">'+t('resume')+' ('+saved.placed.length+'/'+cnt.n+')</span>':'');
      b.onclick=()=>{
        if(prem&&!hasResume&&!spendRain()){  // 이어하기는 무료 (이미 코인 낸 판)
          coinEl.textContent=t('rainOut');
          coinEl.classList.add('deny');coinEl.classList.remove('shake');void coinEl.offsetWidth;coinEl.classList.add('shake');
          beep(220,.16,0,.12);beep(180,.2,.13,.12);
          return;
        }
        $('sheet').hidden=true;openGame(pendingSid,cnt,pendingDaily);
      };
      box.appendChild(b);
    }catch(e){showErr((e&&e.message||e)+' @sheetOpts')}
  }
  $('sheet').hidden=false;
}
$('sheetCancel').onclick=()=>{$('sheet').hidden=true};
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))$('sheet').hidden=true});

/* ── 오늘의 퍼즐 ── */
function dayStamp(d){d=d||new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function todayScene(){
  const d=new Date(), n=Math.floor(d.getTime()/86400000);
  return SCENES[n%SCENES.length];
}

/* ── 홈 렌더 ── */
function showErr(msg){
  let t=document.getElementById('errbar');
  if(!t){t=document.createElement('div');t.id='errbar';
    t.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#B3261E;color:#fff;font:12px/1.4 monospace;padding:8px 10px;border-radius:10px;word-break:break-all';
    t.onclick=()=>{t.hidden=true};
    document.body.appendChild(t)}
  t.hidden=false;
  t.textContent='\u26a0 '+msg+'  (탭하면 닫혀요)';
  clearTimeout(t._t);t._t=setTimeout(()=>{t.hidden=true},8000);
}
function renderHome(){try{renderHomeInner()}catch(e){showErr((e&&e.message||e)+' @renderHome')}}
function renderHomeInner(){
  $('starN').textContent=store.get('stars',0);
  $('streakN').textContent=store.get('streak',{n:0}).n;
  syncCoins();
  const ds=todayScene();
  paintThumb($('dailyThumb'),ds.id);
  $('dailyName').textContent=sceneName(ds);
  $('dailyDate').textContent=new Date().toLocaleDateString(lang==='en'?'en-US':'ko-KR',
    {month:'long',day:'numeric',weekday:'long'});
  $('dailyPlay').onclick=()=>openSheet(ds.id,true);
  const done=store.get('done',{});
  const g=$('gallery');g.innerHTML='';
  for(const sc of SCENES){
    const b=document.createElement('button');b.className='card';
    const cv=document.createElement('canvas');cv.width=360;cv.height=270;
    b.appendChild(cv);
    const row=document.createElement('span');row.className='row';
    row.innerHTML='<span class="name">'+sceneName(sc)+'</span>'+
      (done[sc.id]?'<span class="chip star">⭐</span>':'')+
      (sc.free?'<span class="chip free">'+t('free')+'</span>':'<span class="chip prem">'+t('prem')+'</span>');
    b.appendChild(row);
    b.onclick=()=>openSheet(sc.id,false);
    g.appendChild(b);
    paintThumb(cv,sc.id);
  }
  const ag=$('artGallery');ag.innerHTML='';
  for(const pk of PACKS){
    const items=ARTS.filter(a=>a.pack===pk.id);
    const b=document.createElement('button');b.className='card';
    const cv=document.createElement('canvas');cv.width=360;cv.height=270;
    b.appendChild(cv);
    const row=document.createElement('span');row.className='row';
    row.innerHTML='<span class="name">'+sceneName(pk)+'</span>'+
      (items.every(a=>done[a.id])?'<span class="chip star">⭐</span>':'')+
      '<span class="chip prem">'+items.length+'</span>';
    b.appendChild(row);
    b.onclick=()=>openPack(pk.id);
    ag.appendChild(b);
    const cx=cv.getContext('2d');cx.fillStyle='#EFE8DA';cx.fillRect(0,0,360,270);
    items.slice(0,4).forEach((sc,i)=>{
      const x=(i%2)*181, y=(i>>1)*136;
      const e=sc.img&&IMGS[sc.id];
      if(e&&e.ok)cx.drawImage(e.img,x,y,179,134);
    });
  }
  // 마지막 사진
  const pd=store.get('photo',null);
  if(pd&&!photoImg){
    const img=new Image();
    img.onload=()=>{photoImg=img;photoArt=null;
      $('lastPhotoCard').hidden=false;
      paintThumb($('lastPhotoThumb'),'photo');
      $('photoStar').textContent=done.photo?'⭐':'';
    };
    img.src=pd;
  }else if(photoImg){
    $('lastPhotoCard').hidden=false;
    paintThumb($('lastPhotoThumb'),'photo');
    $('photoStar').textContent=done.photo?'⭐':'';
  }
}
$('lastPhotoCard').onclick=()=>{if(photoImg)openSheet('photo',false)};
$('photoBtn').onclick=()=>$('photoInput').click();
$('photoInput').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f)return;
  const url=URL.createObjectURL(f), img=new Image();
  img.onload=()=>{
    URL.revokeObjectURL(url);
    // 800×600 커버 크롭으로 축소 저장 (기기 안에서만)
    const cv=document.createElement('canvas');cv.width=IW;cv.height=IH;
    const ctx=cv.getContext('2d');
    const ir=img.width/img.height, br=IW/IH;
    let sw=img.width, sh=img.height, sx=0, sy=0;
    if(ir>br){sw=sh*br;sx=(img.width-sw)/2}else{sh=sw/br;sy=(img.height-sh)/2}
    ctx.drawImage(img,sx,sy,sw,sh,0,0,IW,IH);
    const small=new Image();
    small.onload=()=>{photoImg=small;photoArt=null;store.set('photo',small.src);
      store.del('pp:photo:3x2');store.del('pp:photo:4x3');store.del('pp:photo:6x4');store.del('pp:photo:8x6');
      openSheet('photo',false);renderHome()};
    small.src=cv.toDataURL('image/jpeg',.82);
  };
  img.src=url;
  e.target.value='';
});

$('acctBtn').onclick=()=>{$('acct').hidden=false};
$('acctCancel').onclick=()=>{$('acct').hidden=true};
$('acct').addEventListener('click',e=>{if(e.target===$('acct'))$('acct').hidden=true});

applyLang();
// 이미지 씬 프리로드 — 도착하는 대로 카드 갱신 (디바운스)
{let rhq=null;
[...SCENES,...ARTS].filter(s=>s.img).forEach(s=>ensureImg(s).then(()=>{
  clearTimeout(rhq);rhq=setTimeout(renderHome,180)}));}
